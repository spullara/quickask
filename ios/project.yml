name: Quisk
options:
  bundleIdPrefix: ai.quisk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 49Z7UCNQ36
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
targets:
  Quisk:
    type: application
    platform: iOS
    sources: [Quisk]
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    postBuildScripts:
      # Microsoft ships onnxruntime.framework prebuilt, stripped and without a dSYM, so App Store uploads warn that its
      # dSYM is missing. On archive, make one from the binary: it carries the matching UUIDs (no function names exist
      # to add), which is what the upload checks.
      - name: Fix onnxruntime.framework for App Store Connect
        basedOnDependencyAnalysis: false
        script: |
          fw="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/onnxruntime.framework"
          bin="$fw/onnxruntime"
          [ -f "$bin" ] || exit 0
          # Its Info.plist says MinimumOSVersion 15.1 but the binary is built for iOS 17.0, and App Store Connect
          # rejects the mismatch (ITMS-90208). Use the binary's real minimum, then sign the framework again.
          minos="$(vtool -show-build "$bin" | awk '/minos/ {print $2; exit}')"
          if [ -n "$minos" ] && [ "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$fw/Info.plist")" != "$minos" ]; then
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion $minos" "$fw/Info.plist"
            if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
              codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --preserve-metadata=identifier,entitlements "$fw"
            fi
          fi
          if [ "$ACTION" = "install" ]; then
            dsymutil "$bin" -o "$DWARF_DSYM_FOLDER_PATH/onnxruntime.framework.dSYM" 2>/dev/null || true
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.quisk.app
        PRODUCT_NAME: Quisk
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quisk
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # iPad multitasking requires all four orientations.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Quisk listens to your question when you ask aloud.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Quisk turns your spoken question into text.
        INFOPLIST_KEY_NSSiriUsageDescription: Ask Quisk questions with Siri and hear the answers.
